        releaseDate: 2024
        url: https://arxiv.org/abs/2412.00568
        summary: Introduces The Well, a large and varied collection of numerical physics simulations designed to support training and evaluation of scientific machine-learning methods.

      - title: 'Trapped acoustic waves and raindrops: High-order accurate integral equation method for localized excitation of a periodic staircase'
        authors:
        - Fruzsina J. Agocs
        - Alex H. Barnett
        publisher: Journal of Computational Physics
        releaseDate: 2024
        url: https://doi.org/10.1016/j.jcp.2024.113383
        summary: Develops a high-order integral equation method for the localized excitation of an infinite periodic staircase, and analyzes the emerging trapped acoustic waves and related scattering behavior.

      - title: Quantum initial conditions for curved inflating universes
        authors:
        - M. I. Letey
        - Z. Shumaylov
        - Fruzsina J. Agocs
        - W. J. Handley
        - M. P. Hobson
        - A. N. Lasenby
        publisher: Physical Review D
        releaseDate: '2024-06-03'
        url: https://doi.org/10.1103/PhysRevD.109.123502
        summary: Examines the construction and quantization of inflationary perturbations in curved universes and the choice of their quantum initial conditions.

      - title: An adaptive spectral method for oscillatory second-order linear ODEs with frequency-independent cost
        authors:
        - Fruzsina J. Agocs
        - Alex H. Barnett
        publisher: SIAM Journal on Numerical Analysis
        releaseDate: 2024
        url: https://arxiv.org/abs/2212.06924
        summary: Presents an adaptive spectral solver for second-order linear differential equations whose cost can remain essentially independent of oscillation frequency.

      - title: 'riccati: an adaptive, spectral solver for oscillatory ODEs'
        authors:
        - Fruzsina J. Agocs
        - Alex H. Barnett
        publisher: Journal of Open Source Software
        releaseDate: 2023
        url: https://joss.theoj.org/papers/10.21105/joss.05430
        summary: Introduces open-source software using adaptive spectral techniques to solve rapidly oscillatory ordinary differential equations efficiently.

