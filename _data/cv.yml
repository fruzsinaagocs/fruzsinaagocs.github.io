    Publications:
      - title: Integral equations for flexural scattering problems with periodic boundaries
        authors:
        - Fruzsina J. Agocs
        - Tristan Goodwill
        - Jeremy G. Hoskins
        - Peter Nekrasov
        publisher: arXiv
        releaseDate: '2026-02-27'
        url: https://arxiv.org/abs/2603.00366
        summary: Presents a boundary integral equation method to simulate flexural wave scattering by periodic boundaries and junctions of semi-infinite scatterer arrays.

      - title: An efficient boundary integral equation solution technique for solving aperiodic scattering problems from two-dimensional, periodic boundaries
        authors:
        - Riley Fisher
        - Fruzsina J. Agocs
        - Adrianna Gillman
        publisher: arXiv
        releaseDate: 2025
        url: https://arxiv.org/abs/2511.04424
        summary: Presents an efficient boundary integral equation approach for Helmholtz scattering from periodic boundaries excited by a non-periodic source. The method presented improves on previous approaches by precomputing shared quantities among solves in a Floquet-Bloch transform, using the Woodbury formula, and by implementing corner compression.

      - title: Complex Scaling for the Junction of Semi-infinite Gratings
        authors:
        - Fruzsina J. Agocs
        - Tristan Goodwill
        - Jeremy G. Hoskins
        publisher: arXiv
        releaseDate: 2025
        url: https://arxiv.org/abs/2509.02951
        summary: Develops and analyzes a complex-scaled integral equation approach for scattering from joined semi-infinite periodic structures.

      - title: 'The Well: a Large-Scale Collection of Diverse Physics Simulations for Machine Learning'
        authors:
        - Ruben Ohana
        - Michael McCabe
        - Lucas Meyer
        - Rudy Morel
